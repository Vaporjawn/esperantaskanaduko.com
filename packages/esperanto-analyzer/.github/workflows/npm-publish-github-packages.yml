# Publishes a GitHub-Packages-scoped copy of this package (@vaporjawn/esperanto-analyzer)
# to npm.pkg.github.com so it shows up under https://github.com/Vaporjawn?tab=packages.
# This repo has no CI/publish workflows at all yet (only dependabot automation), so
# this is purely additive and does not touch how the package is published to npmjs.com.
#
# --ignore-scripts skips prepublishOnly (which runs typecheck/lint/test/build) since the
# build is done explicitly as its own step here, and the goal of this workflow is just
# to get the current build published, not to re-run the full local verification suite.
name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Scope package name for GitHub Packages
        run: npm pkg set name="@vaporjawn/esperanto-analyzer"
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
